# Integration tests run against an in-memory H2 database in MySQL mode,
# using the same Flyway migrations as production.
spring:
  datasource:
    url: jdbc:h2:mem:roamstead;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  datasource.hikari.maximum-pool-size: 20
