# Credentials are NEVER committed. They are read from environment variables
# (or from an untracked .env / application-local.yml - see SETUP_GUIDE.md).
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: roamstead-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/roamstead?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate never changes it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  config:
    import: optional:file:./application-local.yml

roamstead:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  booking:
    max-nights: 30
    max-days-ahead: 365
  flex:
    search-window-days: 7
    max-suggestions: 4
